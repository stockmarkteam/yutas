[package]
name = "yutas"
version = "0.0.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
arboard = "3"
keyring = { version = "3", features = ["apple-native"] }
objc2 = "0.6"

[profile.release]
strip = true
