<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>yutas</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: "Hiragino Sans", system-ui, sans-serif;
    user-select: none;
  }
  body { display: flex; align-items: center; justify-content: center; }

  #pill {
    display: flex; align-items: center; gap: 10px;
    max-width: 440px; box-sizing: border-box;
    padding: 10px 18px 10px 14px;
    border-radius: 999px;
    background: rgba(22, 24, 29, 0.94);
    border: 1px solid rgba(255, 255, 255, 0.10);
    color: #f2f3f5; font-size: 15px; line-height: 1.3;
    opacity: 0; transform: translateY(8px) scale(0.97);
    transition: opacity 140ms ease, transform 140ms ease;
  }
  #pill.show { opacity: 1; transform: none; }

  #icon { width: 22px; height: 22px; flex: none; display: grid; place-items: center; }

  /* working: three bars, like a voice meter but for typing */
  .bars { display: flex; gap: 3px; align-items: center; height: 16px; }
  .bars i {
    width: 3px; height: 6px; border-radius: 2px; background: #7cc4ff;
    animation: bar 900ms ease-in-out infinite;
  }
  .bars i:nth-child(2) { animation-delay: 150ms; }
  .bars i:nth-child(3) { animation-delay: 300ms; }
  @keyframes bar { 0%, 100% { height: 5px; opacity: .55; } 50% { height: 16px; opacity: 1; } }

  .mark { font-size: 15px; font-weight: 700; }
  .done .mark { color: #6fdc8c; }
  .error .mark { color: #ff8389; }
  .info .mark { color: #b8bcc4; }

  #text {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    direction: rtl; text-align: left;   /* keep the tail of streamed text visible */
  }
  #text span { direction: ltr; unicode-bidi: bidi-override; }
  #hint { color: #9aa0aa; font-size: 12px; flex: none; }
  #hint:empty { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .bars i { animation: none; height: 10px; }
    #pill { transition: none; }
  }
</style>
</head>
<body>
  <div id="pill" class="info">
    <div id="icon"></div>
    <div id="text"><span></span></div>
    <div id="hint"></div>
  </div>
<script>
  const pill = document.getElementById('pill');
  const icon = document.getElementById('icon');
  const text = document.querySelector('#text span');
  const hint = document.getElementById('hint');

  const ICONS = {
    working: '<div class="bars"><i></i><i></i><i></i></div>',
    done: '<span class="mark">✓</span>',
    error: '<span class="mark">!</span>',
    info: '<span class="mark">·</span>',
  };

  function render(p) {
    if (p.state === 'hide') { pill.classList.remove('show'); return; }
    pill.className = 'show ' + p.state;
    icon.innerHTML = ICONS[p.state] || ICONS.info;
    text.textContent = p.text || '';
    hint.textContent = p.hint || '';
  }

  window.__TAURI__.event.listen('pill', (e) => render(e.payload));
</script>
</body>
</html>
